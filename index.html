<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Instalación de Tapas - EPS EMAPA HUARAL S.A.</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Ocultar flechas de incremento/decremento en inputs de número */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-sky-900 to-blue-950 min-h-screen p-3 md:p-6 flex items-center justify-center font-sans">

  <div class="w-full max-w-lg bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl overflow-hidden border border-white/20">
    
    <!-- CABECERA INSTITUCIONAL -->
    <div class="bg-gradient-to-r from-blue-900 via-sky-800 to-cyan-700 p-6 text-white text-center relative overflow-hidden">
      <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
      
      <!-- LOGO LIMPIO VECTORIZADO -->
      <div class="w-24 h-24 bg-white rounded-full mx-auto mb-3 p-2.5 shadow-xl flex items-center justify-center border-2 border-cyan-300">
        <svg viewBox="0 0 100 120" class="w-full h-full">
          <!-- Charco -->
          <ellipse cx="50" cy="110" rx="35" ry="6" fill="#88c5ec"/>
          <ellipse cx="50" cy="108" rx="28" ry="4" fill="#0c4a79"/>
          
          <!-- Gota Exterior Azul Oscuro -->
          <path d="M 50 8 C 50 8, 12 60, 12 80 A 38 38 0 0 0 88 80 C 88 60, 50 8, 50 8 Z" fill="#0f2b5c"/>
          <!-- Gota Interior Blanca -->
          <path d="M 50 14 C 50 14, 16 62, 16 80 A 34 34 0 0 0 84 80 C 84 62, 50 14, 50 14 Z" fill="#ffffff"/>
          
          <!-- Franjas cyan interiores -->
          <rect x="42" y="28" width="16" height="60" fill="#0094d8"/>
          <rect x="64" y="48" width="12" height="40" fill="#0094d8"/>
          <rect x="28" y="60" width="8" height="28" fill="#0094d8"/>
          
          <!-- Grifo / Válvula estilizada en color oscuro -->
          <rect x="36" y="58" width="28" height="6" fill="#0f2b5c" rx="2"/>
          <path d="M 44 58 L 44 48 L 56 48 L 56 58 Z" fill="#0f2b5c"/>
          <rect x="40" y="44" width="20" height="4" fill="#0f2b5c" rx="1"/>
          <path d="M 58 64 L 58 74 C 58 78, 64 78, 64 74 L 64 64 Z" fill="#0f2b5c"/>

          <!-- Flecha envolvente celeste -->
          <path d="M 18 68 C 10 82, 22 100, 42 100" fill="none" stroke="#68c7f2" stroke-width="7" stroke-linecap="round"/>
          <polygon points="40,94 49,100 40,106" fill="#68c7f2"/>
        </svg>
      </div>

      <h1 class="text-xl font-black tracking-wide uppercase drop-shadow">EPS EMAPA HUARAL S.A.</h1>
      <p class="text-xs text-cyan-200 font-bold tracking-widest uppercase mt-0.5">GESTIÓN COMERCIAL</p>
      <div class="mt-2.5 inline-block bg-white/15 backdrop-blur-md border border-white/20 text-white text-[11px] px-3.5 py-1 rounded-full font-semibold">
        Control de Instalación de Tapas de Agua
      </div>
    </div>

    <div class="p-6 md:p-8">
      <!-- LOGIN -->
      <div id="sec-login" class="space-y-5">
        <div class="text-center">
          <h2 class="text-lg font-bold text-slate-800">Iniciar Sesión</h2>
          <p class="text-xs text-slate-500">Ingrese su DNI para acceder al sistema</p>
        </div>

        <form onsubmit="login(event)" class="space-y-5">
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2 text-center">DNI del Responsable (8 dígitos)</label>
            <input 
              type="number" 
              id="inputDni" 
              placeholder="00000000" 
              maxlength="8"
              oninput="if(this.value.length > 8) this.value = this.value.slice(0, 8);"
              class="w-full border-2 border-slate-200 focus:border-cyan-600 rounded-xl p-3.5 text-center text-2xl font-black text-slate-800 tracking-widest placeholder:text-slate-300 outline-none transition shadow-inner bg-slate-50"
            >
          </div>

          <button type="submit" id="btnIngresar" class="w-full bg-gradient-to-r from-cyan-600 via-blue-600 to-blue-800 text-white py-4 rounded-xl font-bold shadow-lg shadow-blue-500/30 hover:shadow-blue-500/50 hover:scale-[1.01] active:scale-[0.99] transition duration-200">
            INGRESAR AL SISTEMA
          </button>
        </form>
      </div>

      <!-- PANEL PRINCIPAL -->
      <div id="sec-panel" class="hidden space-y-6">
        <div class="flex justify-between items-center bg-slate-50 border border-slate-200 p-3.5 rounded-xl">
          <div>
            <p id="lblUsuario" class="font-bold text-slate-800 text-sm md:text-base leading-tight"></p>
            <span id="lblRol" class="inline-block mt-1 text-[10px] bg-blue-600 text-white px-2.5 py-0.5 rounded-md font-bold uppercase tracking-wider shadow-sm"></span>
          </div>
          <button onclick="location.reload()" class="text-xs bg-red-50 text-red-600 border border-red-200 px-3 py-1.5 rounded-lg font-bold hover:bg-red-100 transition">
            Salir
          </button>
        </div>

        <!-- FORMULARIO SOLO PARA ADMINISTRADOR -->
        <div id="formAdmin" class="hidden bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3.5">
          <h3 class="font-bold text-slate-800 text-sm border-b border-slate-200 pb-2 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-cyan-600"></span> Asignar Nuevo Trabajo
          </h3>
          
          <div class="flex gap-2">
            <input type="text" id="regCodSuministro" placeholder="Cód. Suministro" class="w-full border p-2.5 rounded-lg text-sm font-semibold outline-none focus:border-cyan-600">
            <button type="button" id="btnBuscar" onclick="buscarCod()" class="bg-slate-800 text-white px-4 py-2.5 rounded-lg text-sm font-bold hover:bg-slate-900 transition">
              Buscar
            </button>
          </div>

          <input type="text" id="regNombre" placeholder="Nombre Usuario" class="w-full border p-2.5 rounded-lg text-sm bg-slate-100 font-medium" readonly>
          <input type="text" id="regDomicilio" placeholder="Domicilio" class="w-full border p-2.5 rounded-lg text-sm bg-slate-100 font-medium" readonly>
          
          <div class="grid grid-cols-3 gap-2">
            <input type="text" id="regSector" placeholder="Sector" class="border p-2 rounded-lg text-xs bg-slate-100 text-center font-medium" readonly>
            <input type="text" id="regCategoria" placeholder="Categoría" class="border p-2 rounded-lg text-xs bg-slate-100 text-center font-medium" readonly>
            <input type="text" id="regMedidor" placeholder="Medidor" class="border p-2 rounded-lg text-xs bg-slate-100 text-center font-medium" readonly>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Personal Asignado:</label>
            <select id="regResponsable" class="w-full border p-2.5 rounded-lg text-sm font-semibold text-slate-700 outline-none focus:border-cyan-600">
              <option value="">-- Seleccionar Responsable --</option>
            </select>
          </div>

          <input type="text" id="regMotivo" placeholder="Motivo de cambio (Opcional)" class="w-full border p-2.5 rounded-lg text-sm">
          
          <button type="button" id="btnGuardar" onclick="guardarRegistro()" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-bold text-sm shadow-md shadow-emerald-600/20 hover:bg-emerald-700 transition">
            Guardar y Asignar Trabajo
          </button>
        </div>

        <!-- LISTA DE ASIGNACIONES -->
        <div>
          <h3 class="font-bold text-slate-800 text-sm mb-3">Registros de Instalación</h3>
          <div id="listaRegistros" class="space-y-3"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxNA-wPUmNt9v9_IyujkWrM1GD3OvslbM4QlGSuDH4e-WaSBc9af_liZIUAGCP0nJUG/exec";
    
    let usuarioActual = { dni: '', nombre: '', rol: '' };
    let listaResponsables = [];

    async function login(e) {
      if (e) e.preventDefault();

      const dniInput = document.getElementById('inputDni');
      const btn = document.getElementById('btnIngresar');
      const dni = dniInput.value.trim();
      
      if (!dni || dni.length !== 8) return alert('Por favor, ingrese un DNI válido de 8 dígitos');

      btn.innerText = 'CARGANDO...';
      btn.disabled = true;

      try {
        const res = await fetch(`${API_URL}?dni=${encodeURIComponent(dni)}`).then(r => r.json());

        if (!res.ok) {
          alert(res.mensaje || 'DNI no autorizado.');
          btn.innerText = 'INGRESAR AL SISTEMA';
          btn.disabled = false;
          return;
        }

        usuarioActual = { dni, nombre: res.nombre, rol: res.rol };
        listaResponsables = res.responsables || [];

        document.getElementById('sec-login').classList.add('hidden');
        document.getElementById('sec-panel').classList.remove('hidden');
        document.getElementById('lblUsuario').innerText = res.nombre;
        document.getElementById('lblRol').innerText = res.rol;

        if (res.rol === 'administrador') {
          document.getElementById('formAdmin').classList.remove('hidden');
          const select = document.getElementById('regResponsable');
          select.innerHTML = '<option value="">-- Seleccionar Responsable --</option>';
          listaResponsables.forEach(r => {
            select.innerHTML += `<option value="${r.dni}">${r.nombre || r.dni}</option>`;
          });
        }

        renderRegistros(res.registros);
      } catch (err) {
        alert('Error de conexión con la base de datos.');
        console.error(err);
      } font-medium {
        btn.innerText = 'INGRESAR AL SISTEMA';
        btn.disabled = false;
      }
    }

    async function buscarCod() {
      const codInput = document.getElementById('regCodSuministro');
      const btn = document.getElementById('btnBuscar');
      const cod = codInput.value.trim();
      
      if (!cod) return alert('Ingrese un código de suministro');

      btn.innerText = '...';
      btn.disabled = true;

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ dni: usuarioActual.dni, accion: 'buscarSuministro', codSuministro: cod })
        }).then(r => r.json());

        if (!res.ok) return alert(res.mensaje);

        document.getElementById('regNombre').value = res.nombreUsuario;
        document.getElementById('regDomicilio').value = res.domicilio;
        document.getElementById('regSector').value = res.sector;
        document.getElementById('regCategoria').value = res.categoria;
        document.getElementById('regMedidor').value = res.nroMedidor;
      } catch (err) {
        alert('Error al buscar suministro');
      } finally {
        btn.innerText = 'Buscar';
        btn.disabled = false;
      }
    }

    async function guardarRegistro() {
      const cod = document.getElementById('regCodSuministro').value.trim();
      const resp = document.getElementById('regResponsable').value;
      const btn = document.getElementById('btnGuardar');

      if (!cod || !resp) return alert('Busque un suministro y seleccione un responsable');

      btn.innerText = 'Guardando...';
      btn.disabled = true;

      const payload = {
        dni: usuarioActual.dni,
        accion: 'crearRegistro',
        codSuministro: cod,
        dniResponsable: resp,
        motivoCambio: document.getElementById('regMotivo').value
      };

      try {
        const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) }).then(r => r.json());
        alert(res.mensaje);
        if (res.ok) {
          document.getElementById('regCodSuministro').value = '';
          document.getElementById('regNombre').value = '';
          document.getElementById('regDomicilio').value = '';
          document.getElementById('regSector').value = '';
          document.getElementById('regCategoria').value = '';
          document.getElementById('regMedidor').value = '';
          document.getElementById('regMotivo').value = '';
          login();
        }
      } catch (err) {
        alert('Error al registrar');
      } finally {
        btn.innerText = 'Guardar y Asignar Trabajo';
        btn.disabled = false;
      }
    }

    function renderRegistros(lista) {
      const cont = document.getElementById('listaRegistros');
      cont.innerHTML = '';

      if (!lista || lista.length === 0) {
        cont.innerHTML = '<p class="text-xs text-slate-500 text-center py-6 bg-slate-50 rounded-xl border border-dashed border-slate-300">No hay trabajos asignados pendientes.</p>';
        return;
      }

      lista.forEach(reg => {
        const esPendiente = reg.estado === 'Pendiente';
        const card = document.createElement('div');
        card.className = "border rounded-xl p-4 bg-slate-50 space-y-2 border-slate-200 shadow-sm";
        
        card.innerHTML = `
          <div class="flex justify-between items-start gap-2">
            <div>
              <p class="font-bold text-slate-800 text-sm">${reg.codSuministro} - ${reg.nombreUsuario}</p>
              <p class="text-xs text-slate-600">${reg.domicilio} (Medidor: ${reg.nroMedidor || 'S/N'})</p>
            </div>
            <span class="text-[10px] uppercase tracking-wider px-2 py-0.5 rounded-md font-bold ${esPendiente ? 'bg-amber-100 text-amber-800 border border-amber-200' : 'bg-emerald-100 text-emerald-800 border border-emerald-200'}">${reg.estado}</span>
          </div>

          ${esPendiente ? `
            <div class="border-t border-slate-200 pt-3 mt-2 space-y-2">
              <label class="block text-xs font-bold text-slate-700">Tomar Foto / Subir Evidencia:</label>
              <input type="file" id="file-${reg.id}" accept="image/*,application/pdf" capture="environment" class="w-full text-xs text-slate-700 bg-white border p-1 rounded-lg">
              <input type="text" id="obs-${reg.id}" placeholder="Observación en campo (opcional)" class="w-full border p-2 rounded-lg text-xs outline-none">
              <button type="button" id="btnValidar-${reg.id}" onclick="ejecutarTapa('${reg.id}')" class="w-full bg-blue-600 text-white py-2 rounded-lg font-bold text-xs hover:bg-blue-700 transition">
                Validar y Subir Evidencia
              </button>
            </div>
          ` : `
            <div class="border-t border-slate-200 pt-2 text-xs text-slate-600 space-y-1">
              <p><span class="font-semibold">Ejecutado el:</span> ${reg.fechaEjecucion}</p>
              ${reg.evidencias && reg.evidencias.length > 0 ? `
                <div class="flex gap-2 flex-wrap">
                  ${reg.evidencias.map(e => `<a href="${e.url}" target="_blank" class="text-blue-600 font-bold underline">${e.tipo}</a>`).join(' | ')}
                </div>
              ` : ''}
            </div>
          `}
        `;
        cont.appendChild(card);
      });
    }

    async function ejecutarTapa(id) {
      const fileInput = document.getElementById(`file-${id}`);
      const obs = document.getElementById(`obs-${id}`).value;
      const btn = document.getElementById(`btnValidar-${id}`);
      const archivos = [];

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const base64 = await toBase64(file);
        archivos.push({ nombre: file.name, mime: file.type, base64 });
      }

      btn.innerText = 'Subiendo evidencia...';
      btn.disabled = true;

      const payload = {
        dni: usuarioActual.dni,
        accion: 'marcarEjecutado',
        registroId: id,
        comentario: obs,
        archivos
      };

      try {
        const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) }).then(r => r.json());
        alert(res.mensaje);
        if (res.ok) login();
      } catch (err) {
        alert('Error al procesar la validación');
      } finally {
        btn.innerText = 'Validar y Subir Evidencia';
        btn.disabled = false;
      }
    }

    const toBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });
  </script>
</body>
</html>
